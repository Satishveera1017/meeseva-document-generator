{% extends "base.html" %}
{% block title %}Generate Aadhaar{% endblock %}
{% block content %}
<section class="panel registration-panel">
  <p class="eyebrow">NEW RECORD</p>
  <h2>Enter identity details</h2>
  <form class="registration-form" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button button-submit" type="submit">Submit</button>
  </form>
</section>
{% endblock %}
