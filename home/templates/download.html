{% extends "base.html" %}
{% block title %}Download Aadhaar{% endblock %}
{% block content %}
<section class="panel button-page">
  <p class="eyebrow">View & Download</p>
  <h2>Choose Aadhaar format</h2>
  <p class="lead">Select the Aadhaar document you want to view and download.</p>
  <div class="actions">
    <a class="button button-masked" href="{% url 'document_view' record.number 'masked' %}">Masked</a>
    <a class="button button-unmasked" href="{% url 'document_view' record.number 'unmasked' %}">Unmasked</a>
  </div>
</section>
{% endblock %}
